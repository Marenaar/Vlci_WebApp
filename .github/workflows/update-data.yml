name: Aktualizace dat ze sipky.org

on:
  schedule:
    - cron: "17 */3 * * *"   # každé 3 hodiny (čas UTC)
  workflow_dispatch:          # jde spustit i ručně v záložce Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - name: Commit, pokud se data změnila
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "vlci-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Aktualizace dat"
            git push
          fi
